name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir
        run: unzip -o lib.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear proyecto Android y copiar tu lib
        run: |
          flutter create --org com.scripta --project-name scripta --platforms android app
          rm -rf app/lib
          cp -r lib app/lib

      - name: Dependencias
        working-directory: app
        run: |
          flutter pub add flutter_localizations --sdk=flutter
          flutter pub add flutter_quill:^11.4.2 file_picker:^10.3.2 path_provider:^2.1.5 shared_preferences:^2.5.3 printing:^5.14.2 pdf:^3.11.3 image_picker:^1.1.2 local_auth:^2.3.0 archive:^4.0.0

      - name: Configuracion de Android
        working-directory: app
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          f=$(find android/app/src/main -name 'MainActivity.kt')
          pkg=$(grep '^package' "$f")
          printf '%s\nimport io.flutter.embedding.android.FlutterFragmentActivity\n\nclass MainActivity : FlutterFragmentActivity()\n' "$pkg" > "$f"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true

      - name: Revisar errores
        working-directory: app
        run: flutter analyze || true

      - name: Compilar APK
        working-directory: app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: scripta-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
       
